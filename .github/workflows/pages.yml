name: SSA Pages preview
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install reportlab==4.4.10 python-docx==1.2.0 pypdf==6.7.0
      - run: npx vite build --config preview/vite.config.mjs
      - run: python scripts/build-resource-documents.py --output pages-dist/resources
      - uses: actions/upload-artifact@v4
        with:
          name: ssa-static-preview
          path: pages-dist
      - uses: actions/configure-pages@v5
        if: github.event_name != 'pull_request'
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request'
        with:
          path: pages-dist
      - uses: actions/deploy-pages@v4
        if: github.event_name != 'pull_request'
